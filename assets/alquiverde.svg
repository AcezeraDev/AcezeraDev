<svg xmlns="http://www.w3.org/2000/svg" width="550" height="260" viewBox="0 0 550 260"><style>
.f{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Inter,Roboto,Arial,sans-serif}
.up{animation:up .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.logo{transform-box:fill-box;transform-origin:center;animation:in 1s cubic-bezier(.34,1.56,.64,1) .3s both,fl 6s ease-in-out 1.3s infinite}
@keyframes in{from{opacity:0;transform:scale(.7) rotate(-8deg)}}
@keyframes fl{50%{transform:translateY(-7px) rotate(2deg)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 6s ease-in-out infinite}
@keyframes halo{50%{opacity:.45;transform:scale(1.12)}}
.ring{stroke-dasharray:160 1400;animation:ring 7s linear infinite}
@keyframes ring{to{stroke-dashoffset:-1560}}
.rule{stroke-dasharray:494;animation:rule 1.2s cubic-bezier(.16,1,.3,1) .5s both}
@keyframes rule{from{stroke-dashoffset:494}}
.cta{animation:cta 2.4s ease-in-out infinite}
@keyframes cta{50%{transform:translate(4px,-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121d2d"/><stop offset="1" stop-color="#0b0f16"/></linearGradient><linearGradient id="edge" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient><radialGradient id="halo"><stop stop-color="#dbb987" stop-opacity=".28"/><stop offset="1" stop-color="#dbb987" stop-opacity="0"/></radialGradient><linearGradient id="ac"><stop stop-color="#dbb987" stop-opacity="0"/><stop offset=".5" stop-color="#dbb987"/><stop offset="1" stop-color="#dbb987" stop-opacity="0"/></linearGradient></defs>
<rect width="550" height="260" rx="20" fill="url(#bg)"/><circle class="halo" cx="455" cy="108" r="110" fill="url(#halo)"/><rect x=".5" y=".5" width="549" height="259" rx="19.5" fill="none" stroke="url(#edge)"/><rect class="ring" x=".5" y=".5" width="549" height="259" rx="19.5" fill="none" stroke="url(#ac)" stroke-width="1.5" stroke-linecap="round"/>
<g class="f">
<g class="up"><rect x="28" y="27" width="4" height="17" rx="2" fill="#dbb987"/>
<text x="42" y="40" font-size="11" fill="#dbb987" letter-spacing="2">WEB + MARCA</text></g>
<text class="up" style="animation-delay:.1s" x="28" y="94" font-size="29" font-weight="700" fill="#f0f6ff">AlquiVerde</text>
<g class="up" style="animation-delay:.2s" font-size="16" fill="#adbed2"><text x="28" y="132">Kits presente com sabonetes vegetais,</text><text x="28" y="156">essências e cuidados naturais.</text></g>
<g class="logo"><image href="data:image/png;base64," x="365" y="47" width="160" height="120" preserveAspectRatio="xMidYMid meet"/></g>
<path class="rule" d="M28 183h494" stroke="#293b52"/>
<text class="up" style="animation-delay:.4s" x="28" y="210" font-size="13" fill="#8098b5">HTML · JavaScript · Vite</text>
<g class="up" style="animation-delay:.5s"><g class="cta"><text x="28" y="239" font-size="12" fill="#dbb987" letter-spacing="1">EXPLORAR PROJETO ↗</text></g></g>
<text x="520" y="240" text-anchor="end" font-size="13" fill="#637c9d">/04</text></g></svg>