<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="t">
<title id="t">Olá, eu sou o Davi. Crio aplicações para aprender, explorar e transformar ideias em ferramentas.</title>
<style>
.f{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Inter,Roboto,Arial,sans-serif}
.m{font-family:'Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.up{animation:up .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.rule{stroke-dasharray:1030;animation:rule 1.4s cubic-bezier(.16,1,.3,1) .5s both}
@keyframes rule{from{stroke-dashoffset:1030}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes bar{from{transform:scaleY(0)}}
.pulse{animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.sheen{animation:sheen 7s ease-in-out 1.5s infinite}
@keyframes sheen{0%{transform:translateX(-400px)}40%,100%{transform:translateX(1500px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121d2d"/><stop offset="1" stop-color="#0b0f16"/></linearGradient>
<linearGradient id="edge" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="sh"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#9cc4ff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#387bff" stop-opacity=".22"/><stop offset="1" stop-color="#387bff" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1100" height="280" rx="20"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1100" height="280" fill="url(#bg)"/>
<ellipse class="pulse" cx="980" cy="20" rx="320" ry="200" fill="url(#glow)"/>
<rect class="sheen" x="0" y="0" width="300" height="280" fill="url(#sh)" transform="skewX(-20)"/>
</g>
<rect x=".5" y=".5" width="1099" height="279" rx="19.5" fill="none" stroke="url(#edge)"/>
<g class="f">
<text class="up m" x="38" y="44" font-size="13" fill="#6aa6ff" letter-spacing="3">01 / QUEM CRIA</text>
<text class="up" x="38" y="94" font-size="34" fill="#f2f6ff" font-weight="700" style="animation-delay:.12s">Olá, eu sou o Davi<tspan fill="#4c93ff">.</tspan></text>
<text class="up" x="38" y="132" font-size="20" fill="#b3c1d4" style="animation-delay:.24s">Crio aplicações para aprender, explorar e transformar ideias em ferramentas.</text>
<path class="rule" d="M38 164H1062" stroke="#2a3d57"/>

<g class="up" style="animation-delay:.6s">
<rect class="bar" x="38" y="194" width="4" height="20" rx="2" fill="#4c93ff" style="animation-delay:.8s"/>
<text x="56" y="210" font-size="17" fill="#e9f0fa" font-weight="600" letter-spacing="1">WEB</text>
<text x="56" y="240" font-size="16" fill="#93a6bf">Interfaces e experiências interativas</text>
</g>
<g class="up" style="animation-delay:.75s">
<rect class="bar" x="394" y="194" width="4" height="20" rx="2" fill="#64d7ff" style="animation-delay:.95s"/>
<text x="412" y="210" font-size="17" fill="#e9f0fa" font-weight="600" letter-spacing="1">DESKTOP</text>
<text x="412" y="240" font-size="16" fill="#93a6bf">Ferramentas além do navegador</text>
</g>
<g class="up" style="animation-delay:.9s">
<rect class="bar" x="750" y="194" width="4" height="20" rx="2" fill="#8b6dff" style="animation-delay:1.1s"/>
<text x="768" y="210" font-size="17" fill="#e9f0fa" font-weight="600" letter-spacing="1">INTELIGÊNCIA ARTIFICIAL</text>
<text x="768" y="240" font-size="16" fill="#93a6bf">Criação e aprendizagem com IA</text>
</g>
</g>
</svg>
