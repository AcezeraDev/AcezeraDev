<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="92" viewBox="0 0 1100 92" role="img" aria-labelledby="t">
<title id="t">Projetos selecionados — da ideia à tela</title>
<style>
.f{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,Inter,Roboto,Arial,sans-serif}
.m{font-family:'Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.up{animation:up .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.ln{stroke-dasharray:640;animation:ln 1.6s cubic-bezier(.16,1,.3,1) .4s both}
@keyframes ln{from{stroke-dashoffset:640}}
.run{animation:run 4s cubic-bezier(.65,0,.35,1) 2s infinite}
@keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(640px);opacity:0}}
.arr{animation:arr 2.4s ease-in-out infinite}
@keyframes arr{50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.run{opacity:0}}
</style>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121d2d"/><stop offset="1" stop-color="#0b0f16"/></linearGradient>
<linearGradient id="edge" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="blue"><stop stop-color="#387bff"/><stop offset="1" stop-color="#64d7ff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1100" height="92" rx="20" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1099" height="91" rx="19.5" fill="none" stroke="url(#edge)"/>
<g class="f">
<text class="up m" x="38" y="36" font-size="13" fill="#6aa6ff" letter-spacing="3">03 / DA IDEIA À TELA</text>
<text class="up" x="38" y="70" font-size="27" fill="#f2f6ff" font-weight="700" style="animation-delay:.12s">Projetos selecionados</text>
<path class="ln" d="M420 61H1060" stroke="url(#blue)" stroke-width="1.5"/>
<circle class="run" cx="420" cy="61" r="3" fill="#64d7ff"/>
<g class="up" style="animation-delay:.5s"><text class="arr m" x="1062" y="40" text-anchor="end" font-size="13" fill="#5f7697" letter-spacing="1">04 PROJETOS →</text></g>
</g>
</svg>
