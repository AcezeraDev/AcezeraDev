<svg xmlns="http://www.w3.org/2000/svg" width="170" height="48" viewBox="0 0 170 48" role="img" aria-label="AlquiVerde — abrir site">
<style>/*ad-fonts*/@font-face{font-family:ADSans;src:url(data:font/woff2;base64,) format('woff2');font-weight:400 700;font-display:block}@font-face{font-family:ADDisplay;src:url(data:font/woff2;base64,) format('woff2');font-weight:500 700;font-display:block}@font-face{font-family:ADMono;src:url(data:font/woff2;base64,) format('woff2');font-weight:400 600;font-display:block}.f,.f text{font-family:ADSans,'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif}.f [font-weight="700"],[font-weight="700"]{font-family:ADDisplay,'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif;letter-spacing:-.025em}.m,.f .m,text.m{font-family:ADMono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500}/*ad-fonts*/

.in{animation:in .8s cubic-bezier(.34,1.56,.64,1) 0.2s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.2s ease-out infinite}
@keyframes pu{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="in f">
<rect x="1.5" y="1.5" width="167" height="45" rx="22.5" fill="#0f1724" stroke="#2a3c56"/>
<circle class="pu" cx="24" cy="24" r="4" fill="#dbb987"/><circle cx="24" cy="24" r="4" fill="#dbb987"/>
<text x="38" y="29.5" font-size="15" font-weight="600" fill="#e3ebf7">AlquiVerde</text>
<text class="m" x="152" y="29" text-anchor="end" font-size="13" fill="#64d7ff">↗</text>
</g>
